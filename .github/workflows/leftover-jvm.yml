name: leftover-jvm

# Leftover JVM library tests. Not operator start.
# Default CI is kotoba compile + instantiateKotoba.
# :run is gone (including --enable-native-access=ALL-UNNAMED).
# This workflow may invoke leftover `clojure -M -m kotoba-code.main` as a
# library, not a start alias. Do not wrap Datalevin/LMDB JNI as a C .so.
on:
  workflow_dispatch:

jobs:
  leftover-jvm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - name: leftover JVM tests (not operator start)
        run: clojure -M:test
      - name: leftover JVM lint (not operator start)
        run: clojure -M:lint
